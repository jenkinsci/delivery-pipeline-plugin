jenkins:
  systemMessage: "Delivery Pipeline plugin 1.4.2 controller, about to be upgraded"
  numExecutors: 4
  mode: NORMAL
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: admin
          password: ${ADMIN_PASSWORD:-admin}
  authorizationStrategy:
    globalMatrix:
      entries:
        - user:
            name: admin
            permissions:
              - "Overall/Administer"
  markupFormatter:
    rawHtml:
      disableSyntaxHighlighting: true
unclassified:
  location:
    url: http://localhost:8080/
    adminAddress: nobody@example.com
security:
  globalJobDslSecurityConfiguration:
    useScriptSecurity: false
jobs:
  - file: /usr/share/jenkins/ref/jobs-legacy.groovy
