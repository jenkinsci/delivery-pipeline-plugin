# Runs the Docker test suite: the seeded controller with its validation, load test and screenshots, and the upgrade
# exercise from 1.4.2. On every push and pull request that can affect them, and on request.
name: docker-suite
on:
  workflow_dispatch:
  push:
    paths:
      - 'docker/**'
      - 'src/main/**'
      - 'pom.xml'
      - '.github/workflows/docker-suite.yml'
  pull_request:
    paths:
      - 'docker/**'
      - 'src/main/**'
      - 'pom.xml'
      - '.github/workflows/docker-suite.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: docker/.m2
          key: docker-m2-${{ hashFiles('pom.xml') }}
          restore-keys: docker-m2-
      - name: Build the plugin and the controller image (Maven runs in a container)
        run: docker/run.sh build
      - name: Start the controller
        run: docker/run.sh up
      - name: Validate
        run: docker/run.sh validate
      - name: Layout
        run: docker/run.sh layout
      - name: Load test
        run: docker/run.sh perf
      - name: Screenshots
        if: always()
        run: docker/run.sh screenshots
      - name: Controller log
        if: always()
        run: docker compose -f docker/docker-compose.yml logs jenkins > docker/out/jenkins.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-validate
          path: docker/out
      - name: Stop
        if: always()
        run: docker/run.sh down
  large-board:
    # JENKINS-40714, JENKINS-64253: the load test on a board of 400 jobs, fifty chains of eight, without the other
    # steps, so that the screenshots keep the twenty-chain board
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PERF_CHAINS: '50'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: docker/.m2
          key: docker-m2-${{ hashFiles('pom.xml') }}
          restore-keys: docker-m2-
      - name: Build the plugin and the controller image (Maven runs in a container)
        run: docker/run.sh build
      - name: Start the controller with fifty chains behind the Deployment board
        run: docker/run.sh up
      - name: Load test
        run: docker/run.sh perf
      - name: Controller log
        if: always()
        run: mkdir -p docker/out && docker compose -f docker/docker-compose.yml logs jenkins > docker/out/jenkins.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-large-board
          path: docker/out
      - name: Stop
        if: always()
        run: docker/run.sh down
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: docker/.m2
          key: docker-m2-${{ hashFiles('pom.xml') }}
          restore-keys: docker-m2-
      - name: Build the plugin
        run: docker/run.sh build
      - name: Upgrade a 1.4.2 controller to this build and check what loaded
        run: docker/upgrade.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-upgrade
          path: docker/out
